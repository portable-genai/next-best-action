[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "next-best-action"
version = "0.0.1"
description = "D5 Next-Best-Action: Recommendations and Cross-Sell — deterministic candidate filtering, eligibility/suitability, marketing-consent and ranking turn a customer or shopper and an offer catalog into cited, human-reviewed next-best-action recommendations, generic across banking and online retail and the JP/AU/SG markets, built ports-and-adapters on the Gemini Enterprise Agent Platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["next-best-action", "recommendations", "cross-sell", "propensity", "eligibility", "consent", "vertex-ai", "gemini", "adk", "gcp", "marketing", "apac"]

# Core deps are framework-light so the domain + on-prem/test (local) profile install
# without any Google Cloud SDK. The managed-service adapters live in the [gcp] extra.
dependencies = [
  # Shared commons, pinned by tag; no build-time coupling. Public repos, so CI
  # installs them with zero credentials. hex-service-kit: outbound S2S, fail-closed net defaults,
  # StrEnum base, to_jsonable, hash-chained WORM audit. agent-eval-kit: the Hrz4
  # promotion-gate client the platform eval adapter uses.
  "hex-service-kit @ git+https://github.com/portable-genai/hex-service-kit@v0.0.1",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-dateutil>=2.9",
  # Shared jurisdiction PII pattern pack (SG/HK/JP/AU rows + checksum validators + RE2-safe
  # forms + the two-part safety scorer). Pure stdlib, zero deps, public. Pinned by tag: the
  # local redactor, the DLP custom info types and the eval leak check all read ONE source, so
  # a pack fix is a version bump instead of a copy that drifts (retires the C4 regex copy).
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  # review-kit: the producer half of rule R8 (route a requires_human_review escalation to
  # the Hrz7 Human-Review & Maker-Checker Console). The Review/Citation primitives, the S2S
  # submission client and the transactional outbox, shared so every producer routes reviews the
  # same way. Pure stdlib (urllib), zero deps, public. Pinned by tag.
  "review-kit @ git+https://github.com/portable-genai/review-kit@v0.0.1",
  # Versioned client contract for Mkt6, the catalog's one consent and preference store.
  # The core asks through a port on every candidate; local supplies a synthetic adapter and
  # managed profiles call the real service. Private today, so CI needs read-only credentials.
  "consent-preference-kit @ git+https://github.com/portable-genai/consent-preference-kit@v0.0.1",
]

[project.optional-dependencies]
# Pinned per mid-2026 research. ADK 2.0 was a breaking release => pin exactly.
gcp = [
  "google-adk==2.3.0",
  "google-genai>=1.21",
  "google-cloud-aiplatform[agent_engines,adk,evaluation]>=1.158.0",
  "google-cloud-bigquery>=3.25",
  "google-cloud-discoveryengine>=0.13",
  "google-cloud-logging>=3.11",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "a2a-sdk>=0.2",
  "mcp>=1.2",
]
# The headless-browser half of the F2 demo proof. Kept OUT of [dev] on purpose: the browser
# binary is a network download, and the day-one offline gate must install and run with no
# network. `tests/browser` skips itself when this extra is absent, and `make demo-browser` runs
# it for anyone who has installed it.
demo = [
  "playwright==1.62.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Pinned exactly: ruff's formatter output changes between releases, so an unpinned
  # version drifts from CI and fails `ruff format --check`. Bump deliberately.
  "ruff==0.15.18",
  "mypy>=1.10",
  "types-PyYAML",
  "respx>=0.21",
]

[project.scripts]
mkt-nba = "next_best_action.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/next_best_action"]

[tool.hatch.metadata]
# Allow the pii-kit git+https direct reference in project.dependencies (public repo, pinned
# by tag; the lockfile resolves it to an exact SHA so the no-build-time-coupling property holds).
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Presentation/demo scripts embed long HTML/CSS string literals; line length there
# hurts more than it helps. The shipped package (src) and tests stay strict.
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires live Google Cloud credentials (deselect with -m 'not integration')",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
