name: Eval gate

# The A4 promotion gate. Runs eval/run_eval.py over the golden recommendation dataset and
# fails (non-zero exit) if any metric (recommendation groundedness, citation accuracy,
# eligibility accuracy, review safety) is below threshold. A release must NOT be promoted to
# the Agent Platform unless this job is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically offline (the in-repo evaluator), so it needs no
  # cloud credentials and no source credential either: consent-preference-kit went public with
  # the migration, so the read-only GitHub App credential this comment used to describe is gone
  # from the file below, exactly as in ci.yaml. Switch to gcp in a protected environment for the
  # live evaluator.
  MKT_NBA_PROFILE: local

jobs:
  eval:
    name: Gen AI eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run eval gate
        # Non-zero exit fails the gate and blocks promotion.
        run: python eval/run_eval.py
