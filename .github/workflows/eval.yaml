name: Eval gate

# The A4 promotion gate. Runs eval/run_eval.py over the golden recommendation dataset and
# fails (non-zero exit) if any metric (recommendation groundedness, citation accuracy,
# eligibility accuracy, review safety) is below threshold. A release must NOT be promoted to
# the Agent Platform unless this job is green.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # The eval gate runs deterministically offline (the in-repo evaluator), so it needs no
  # cloud credentials. It only needs the read-only GitHub App credential used to install the
  # private consent wire kit. Switch to gcp in a protected environment for the live evaluator.
  MKT_NBA_PROFILE: local

jobs:
  eval:
    name: Gen AI eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Mint read-only token for private catalog commons
        id: commons-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CATALOG_COMMONS_APP_ID }}
          private-key: ${{ secrets.CATALOG_COMMONS_APP_PRIVATE_KEY }}
          owner: portable-genai
          repositories: consent-preference-kit

      - name: Configure private commons checkout
        env:
          CATALOG_COMMONS_TOKEN: ${{ steps.commons-token.outputs.token }}
        run: git config --global url."https://x-access-token:${CATALOG_COMMONS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Run eval gate
        # Non-zero exit fails the gate and blocks promotion.
        run: python eval/run_eval.py
